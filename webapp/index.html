<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3157c9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>학원 출결관리</title>
</head>
<body>
  <main class="app-shell">
    <section id="login-view" class="auth-card">
      <div class="brand-mark">출결</div>
      <h1>학원 출결관리</h1>
      <p>기존 앱 계정으로 로그인하세요.</p>
      <form id="login-form">
        <label>아이디<input id="login-id" type="text" autocomplete="username" required></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
      <p id="login-hint" class="hint">아이디만 입력하면 자동으로 @attendance.com을 붙여 로그인합니다.</p>
      <p class="hint">iPhone Safari에서 공유 → 홈 화면에 추가를 누르면 앱처럼 사용할 수 있습니다.</p>
    </section>

    <section id="app-view" hidden>
      <header class="topbar">
        <div><strong id="user-name"></strong><span id="user-role" class="badge"></span></div>
        <button id="logout-button" class="text-button">로그아웃</button>
      </header>
      <div id="content" class="content" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
