<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3157c9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>학원 출결 관리</title>
</head>
<body>
  <main class="app-shell">
    <section id="login-view" class="auth-card">
      <div class="brand-mark">출결</div>
      <h1>학원 출결 관리</h1>
      <p>기존 계정으로 로그인하거나, 등록된 미등록 학생 정보를 이용해 가입하세요.</p>
      <div class="auth-tabs" role="tablist">
        <button id="show-login" class="tab-button active" type="button">로그인</button>
        <button id="show-register" class="tab-button" type="button">학생 회원가입</button>
      </div>
      <form id="login-form">
        <label>아이디<input id="login-id" type="text" autocomplete="username" required></label>
        <label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <form id="register-form" hidden>
        <label>아이디<input id="register-id" type="text" autocomplete="username" required></label>
        <label>비밀번호<input id="register-password" type="password" autocomplete="new-password" minlength="6" required></label>
        <label>학생 이름<input id="register-name" type="text" autocomplete="name" required></label>
        <label>전화번호<input id="register-phone" type="tel" autocomplete="tel" required></label>
        <label>학년
          <select id="register-grade" required>
            <option value="">학년 선택</option><option>초1</option><option>초2</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>고2</option><option>고3</option>
          </select>
        </label>
        <button type="submit">학생 회원가입</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
      <p id="login-hint" class="hint">아이디만 입력하면 자동으로 @attendance.com을 붙여 로그인합니다.</p>
      <a class="apk-download-button" href="https://raw.githubusercontent.com/BlacK-C0W/attendance-app-download/refs/heads/main/Attendance.apk?v=1.0.7">Android 앱 다운로드 (APK v1.0.7)</a>
      <p class="deploy-version">웹앱 버전 v2026.08.07.12 · 배포 기준 2026년 8월 7일</p>
    </section>
    <section id="app-view" hidden>
      <header class="topbar"><div><strong id="user-name"></strong><span id="user-role" class="badge"></span></div><button id="logout-button" class="text-button">로그아웃</button></header>
      <div id="content" class="content" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./app.js?v=9"></script>
</body>
</html>
